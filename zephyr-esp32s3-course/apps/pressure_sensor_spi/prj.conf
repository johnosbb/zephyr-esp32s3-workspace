# Console + logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use newlib so libm provides powf for altitude calculations
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# Display stack for SSD1306
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CFB_LOG_LEVEL_INF=y

# Sensor stack for BMP280 over SPI
CONFIG_SENSOR=y
CONFIG_SPI=y
CONFIG_BME280=y

# Stack room for display + sensor operations
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
