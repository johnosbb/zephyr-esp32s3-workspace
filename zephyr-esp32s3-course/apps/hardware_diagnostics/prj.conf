# Console + logging
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Core drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_SPI=y

# Display stack for SSD1306
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Sensor stack for SHT4x
CONFIG_SENSOR=y
CONFIG_SHT4X=y

# Float formatting for sensor readouts
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use minimal C library to avoid picolibc/newlib complications
CONFIG_MINIMAL_LIBC=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=n

# Stack room for diagnostics
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
