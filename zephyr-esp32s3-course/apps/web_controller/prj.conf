CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_CBPRINTF_FP_SUPPORT=y

# Libc selection (POSIX/VFS needed by HTTP server)
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# POSIX + VFS
CONFIG_POSIX_API=y
CONFIG_FDTABLE=y
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32
CONFIG_EVENTFD=y
CONFIG_FILE_SYSTEM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=n
CONFIG_WIFI_LOG_LEVEL_OFF=y

# HTTP server
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y

# Sensors + buses
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y

# JSON (for LED control)
CONFIG_JSON_LIBRARY=y

# Wi-Fi credentials (see wifi_secrets.conf)
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_TYPE_PSK=y
