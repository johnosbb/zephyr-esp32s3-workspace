CONFIG_MAIN_STACK_SIZE=4096
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console via USB Serial/JTAG (see overlay)
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# Libc selection (avoid picolibc lock hook conflicts)
CONFIG_MINIMAL_LIBC=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=n

# Tracing (CTF + RAM backend)
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_TRACING_BUFFER_SIZE=8192
CONFIG_TRACING_THREAD_STACK_SIZE=3072
CONFIG_RAM_TRACING_BUFFER_SIZE=131072
CONFIG_THREAD_NAME=y
CONFIG_ISR_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Reduce trace activity from interrupt context to avoid ISR stack pressure
CONFIG_TRACING_ISR=n

# Debug info (keep optimizations on ESP32-S3)
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y
